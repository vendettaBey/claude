server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ------------------------------------------------------------------
    # Güvenlik başlıkları
    # HSTS burada değil, TLS'i sonlandıran katmanda (Cloudflare) verilmelidir.
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Uygulama tamamen kendi kaynaklarını kullanır (harici CDN yok).
    # 'unsafe-inline' yalnızca JSON-LD ve tema betiği için style/script'te gerekli.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Sağlık kontrolü
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # API → Laravel (PHP-FPM)
    # API yanıtları asla önbelleğe alınmaz.
    # ------------------------------------------------------------------
    location ^~ /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Oturum korumalı teklif yönetim paneli → Laravel.
    location ^~ /yonetim {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/html/public;

        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
        internal;
    }

    # PHP dosyalarının doğrudan çalıştırılması engellenir.
    location ~ \.php$ {
        return 404;
    }

    # ------------------------------------------------------------------
    # Statik varlıklar
    # Vite çıktısı içerik hash'i taşıdığı için uzun süre önbelleklenebilir.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html asla uzun süre önbelleklenmez; yeni sürüm anında görünmeli.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap.xml {
        expires 1d;
    }

    location = /robots.txt {
        expires 1d;
        access_log off;
    }

    # ------------------------------------------------------------------
    # SPA yönlendirmesi — bilinmeyen yollar React Router'a bırakılır.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gizli dosyalar
    location ~ /\.(?!well-known) {
        deny all;
    }
}
